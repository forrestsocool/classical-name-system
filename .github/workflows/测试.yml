name: 测试

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  测试:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: python -m pip install -r 后端/requirements.txt

      - name: 运行 Python 测试
        env:
          起名管理密钥: ci-test-admin-key-2026
        run: python -m unittest discover -s 测试 -p "test*.py" -v

      - name: 检查前端语法
        run: node --check 前端/app.js

      - name: 检查数据库和部署配置
        env:
          起名管理密钥: ci-test-admin-key-2026
        run: python 脚本/部署检查.py
