global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/起名系统告警.yml

scrape_configs:
  - job_name: classical-name-system
    metrics_path: /metrics
    scrape_timeout: 5s
    static_configs:
      - targets:
          - 127.0.0.1:8000
        labels:
          service: classical-name-system
          environment: production
