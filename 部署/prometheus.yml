global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/起名系统告警.yml
scrape_configs:
  - job_name: classical-name-system
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/name-admin-key
    static_configs:
      - targets: ["127.0.0.1:8000"]
