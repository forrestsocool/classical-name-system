# Included inside nginx's http block. The upstream SNI stream does not forward
# client IPs, so these are deliberate per-site ceilings, NOT per-user limits.
# Authenticated users also have an independent database-backed OPENID limit.
limit_req_zone $server_name zone=name_admin:1m rate=5r/s;
limit_req_zone $server_name zone=name_gateway:1m rate=40r/s;

server {
    listen 80;
    listen [::]:80;
    server_name name.sensen.li;
    server_tokens off;
    return 301 https://name.sensen.li$request_uri;
}

server {
    # In nginx.conf's stream map, name.sensen.li must point to 127.0.0.1:18043.
    # A dedicated loopback listener avoids inheriting another site's TLS policy.
    listen 127.0.0.1:18043 ssl;
    http2 on;
    server_name name.sensen.li;
    server_tokens off;

    ssl_certificate /etc/certs/sensen.li_ecc/fullchain.cer;
    ssl_certificate_key /etc/certs/sensen.li_ecc/sensen.li.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    error_page 497 https://name.sensen.li$request_uri;

    client_max_body_size 32k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;
    limit_req_status 429;
    limit_req_log_level warn;
    error_page 429 = @name_rate_limited;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Stream hides the original IP. Do not trust caller-supplied forwarding headers.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    location = /metrics {
        return 403;
    }
    # Keep the gateway's JSON error contract when nginx rejects a burst.
    location @name_rate_limited {
        default_type application/json;
        return 429 '{"detail":"请求过于频繁，请稍后再试"}';
    }
    # Defense in depth even if someone accidentally enables the legacy bridge.
    location ^~ /api/test/ {
        return 404;
    }
    location = /internal/v1/dispatch {
        client_max_body_size 16k;
        limit_req zone=name_gateway burst=80 nodelay;
        proxy_pass http://127.0.0.1:8010;
    }
    location /internal/ {
        return 404;
    }
    location ^~ /api/admin/ {
        limit_req zone=name_admin burst=20 nodelay;
        proxy_pass http://127.0.0.1:8010;
    }
    location / {
        proxy_pass http://127.0.0.1:8010;
    }
}
