groups:
  - name: classical-name-system
    rules:
      - alert: NameServiceTargetDown
        expr: up{job="classical-name-system"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 起名服务或数据库不可用
      - alert: NameProducerDown
        expr: name_producer_alive == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 持续生产进程心跳中断
      - alert: NameProducerFailures
        expr: name_producer_failing_sources > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 部分来源连续生产失败，请检查模型配置和数据库
