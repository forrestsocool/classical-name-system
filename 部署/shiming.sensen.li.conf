# shiming.sensen.li：由443端口的SNI分流转发到本机8043，再代理到本机8000。
server {
    listen 80;
    listen [::]:80;
    server_name shiming.sensen.li;
    return 301 https://$host$request_uri;
}

server {
    listen 8043 ssl;
    listen [::]:8043 ssl;
    http2 on;
    server_name shiming.sensen.li;

    ssl_certificate /etc/certs/sensen.li/fullchain.cer;
    ssl_certificate_key /etc/certs/sensen.li/sensen.li.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /metrics {
        return 403 "监控指标仅供内部访问\n";
    }

    location / {
        client_max_body_size 64m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://127.0.0.1:8000;
    }
}
