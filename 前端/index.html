<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>古籍智能起名</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="页面">
    <section class="页头">
      <p class="眉题">古籍 · 音形义 · 八字辅助</p>
      <h1>为名字寻找一处古意</h1>
      <p class="副题">从已核验的古籍词组出发，结合个人偏好生成名字。</p>
    </section>

    <section class="面板">
      <form id="起名表单">
        <div class="字段网格">
          <label>姓氏<input id="姓氏" required maxlength="4" placeholder="例如：王"></label>
          <label>名字字数
            <select id="名字长度">
              <option value="2" selected>双字名</option>
              <option value="1">单字名</option>
            </select>
          </label>
          <label>避用字<input id="避用字" maxlength="30" placeholder="可不填"></label>
          <label>必须包含<input id="必须包含" maxlength="2" placeholder="可不填"></label>
        </div>

        <fieldset>
          <legend>文化方向</legend>
          <div id="方向列表" class="方向列表"><span>正在读取方向……</span></div>
        </fieldset>

        <fieldset>
          <legend>五行偏好（可选）</legend>
          <div class="方向列表">
            <label class="方向项"><input type="checkbox" name="五行" value="金"><span>金</span></label>
            <label class="方向项"><input type="checkbox" name="五行" value="木"><span>木</span></label>
            <label class="方向项"><input type="checkbox" name="五行" value="水"><span>水</span></label>
            <label class="方向项"><input type="checkbox" name="五行" value="火"><span>火</span></label>
            <label class="方向项"><input type="checkbox" name="五行" value="土"><span>土</span></label>
          </div>
          <small class="字段提示">只有状态为“已核验”的汉字五行规则会参与排序。</small>
        </fieldset>

        <details>
          <summary>八字辅助（可选）</summary>
          <div class="字段网格">
            <label>出生时间<input id="出生时间" type="datetime-local"></label>
            <label>时区<input id="时区" value="Asia/Shanghai"></label>
            <label>日界规则
              <select id="日界规则">
                <option value="子初" selected>子初换日</option>
                <option value="午夜">午夜换日</option>
              </select>
            </label>
          </div>
        </details>

        <button type="submit">开始起名</button>
      </form>
    </section>

    <section id="状态" class="状态" aria-live="polite"></section>
    <section id="八字结果" class="八字结果"></section>
    <button id="换一批" class="换一批按钮" type="button" hidden>换一批</button>
    <section id="结果列表" class="结果列表"></section>
    <section class="面板">
      <button id="模型补充" type="button" disabled>补充名字释义</button>
      <div id="模型结果" aria-live="polite"></div>
    </section>
    <section class="面板">
      <details>
        <summary>我的收藏与比较</summary>
        <button id="加载收藏" type="button">查看收藏</button>
        <button id="比较收藏" type="button">比较选中名字（最多五个）</button>
        <div id="收藏列表"></div>
        <div id="比较结果"></div>
      </details>
    </section>

    <section class="面板 历史面板">
      <details>
        <summary>任务历史</summary>
        <button id="加载历史" type="button">加载任务历史</button>
        <div id="历史列表" class="历史列表"></div>
      </details>
    </section>

    <section class="面板 年号面板">
      <details>
        <summary>东亚历史年号参考</summary>
        <div class="字段网格">
          <label>关键词<input id="年号关键词" maxlength="40" placeholder="例如：建武"></label>
          <label>地区<input id="年号地区" maxlength="40" placeholder="例如：中国、日本"></label>
        </div>
        <button id="加载年号" type="button">搜索年号</button>
        <div id="年号列表" class="年号列表"></div>
      </details>
    </section>

    <section class="面板 管理面板">
      <details>
        <summary>资料管理</summary>
        <div class="字段网格">
          <label>管理密钥<input id="管理密钥" type="password" autocomplete="off" placeholder="请输入管理密钥"></label>
          <label>复核人<input id="复核人" maxlength="80" placeholder="例如：管理员"></label>
        </div>
        <div class="管理操作">
          <button id="加载复核" type="button">加载待核验片段</button>
          <button id="加载五行规则" type="button">加载待复核五行</button>
          <button id="加载审计问题" type="button">加载待处理问题</button>
          <button id="加载统计" type="button">加载质量统计</button>
        </div>
        <div id="质量统计" class="质量统计"></div>
        <div id="复核列表" class="复核列表"></div>
        <div id="五行规则列表" class="复核列表"></div>
        <div id="审计问题列表" class="复核列表"></div>
      </details>
    </section>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
