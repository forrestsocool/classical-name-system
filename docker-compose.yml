services:
  classical-name-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: classical-name-system
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - 起名数据库路径=/app/构建产物/起名系统.sqlite3
    volumes:
      - ./构建产物:/app/构建产物
